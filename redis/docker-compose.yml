version: '3.8'

services:
  redis:
    image: redislabs/rejson:latest
    container_name: shapley-redisjson-21
    ports:
      - "6380:6379"
    volumes:
      - rejson_data_21:/data
    networks:
      - shapley-network-21

volumes:
  rejson_data_21:

networks:
  shapley-network-21:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.21.0/24
          gateway: 192.168.21.1

